<style>
  #shot-for-a-million {
    --rink: #0a1225;
    --arena: #1a2f57;
    --snow: #f0f6ff;
    --silver: #bbcce4;
    --ice: #a7dfff;
    --gold: #ffcf72;
    color: var(--snow);
    color-scheme: dark;
    font: 400 15px/1.4 "Segoe UI", system-ui, sans-serif;
    isolation: isolate;
  }

  #shot-for-a-million *, #shot-for-a-million *::before, #shot-for-a-million *::after { box-sizing: border-box; }
  #shot-for-a-million h1, #shot-for-a-million h2, #shot-for-a-million p { margin: 0; }
  #shot-for-a-million button { font: inherit; color: inherit; }
  #shot-for-a-million button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  #shot-for-a-million [hidden] { display: none; }

  #shot-for-a-million .shot-stage {
    padding: clamp(14px, 4vw, 30px);
    border: 1px solid rgb(173 215 255 / .27);
    border-radius: 24px;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 80% 3%, rgb(57 115 175 / .48), transparent 55%),
      radial-gradient(ellipse at 1% 80%, rgb(74 67 156 / .33), transparent 52%),
      linear-gradient(153deg, var(--arena), var(--rink) 70%);
    box-shadow: inset 0 1px rgb(241 251 255 / .15);
  }

  #shot-for-a-million .shot-hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 37%);
    gap: clamp(12px, 4vw, 34px);
    align-items: center;
    margin-bottom: clamp(18px, 4vw, 28px);
  }

  #shot-for-a-million .shot-score {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px 11px;
    color: var(--silver);
    font-size: 13px;
  }

  #shot-for-a-million .shot-score span {
    border: 1px solid rgb(255 207 114 / .3);
    background: rgb(255 207 114 / .09);
    color: var(--gold);
    font-weight: 650;
    border-radius: 30px;
    padding: 3px 10px 4px;
  }

  #shot-for-a-million h1 {
    margin: 13px 0 12px;
    color: var(--snow);
    font-size: clamp(29px, 7.6vw, 62px);
    line-height: .98;
    font-weight: 760;
    letter-spacing: -.055em;
    text-wrap: nowrap;
  }

  #shot-for-a-million .shot-situation {
    color: var(--silver);
    font-size: clamp(13px, 2.4vw, 16px);
    line-height: 1.42;
  }

  #shot-for-a-million .shot-situation span { color: var(--snow); }

  #shot-for-a-million .shot-board, #shot-for-a-million .shot-diagram-image {
    display: block;
    position: relative;
    aspect-ratio: 644 / 810;
    overflow: hidden;
    padding: 0;
    border: 1px solid rgb(177 226 255 / .38);
    border-radius: 16px;
    background: var(--rink);
    box-shadow: 0 10px 23px rgb(0 8 22 / .42);
  }

  #shot-for-a-million img {
    display: block;
    width: 100%;
    height: auto;
  }

  #shot-for-a-million .shot-routes {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #shot-for-a-million .shot-track,
  #shot-for-a-million .shot-track-outline,
  #shot-for-a-million .shot-red-track {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #shot-for-a-million .shot-track { stroke: var(--gold); stroke-width: 9; }
  #shot-for-a-million .shot-track-outline { stroke: rgb(7 14 27 / .84); stroke-width: 17; }
  #shot-for-a-million .shot-yellow-arrow path { fill: var(--gold); stroke: #23180d; stroke-width: .6; }

  #shot-for-a-million .shot-red-track {
    stroke: #ff8e97;
    stroke-width: 8;
    stroke-dasharray: 10 13;
    filter: drop-shadow(0 1px 2px #3b101b);
  }

  #shot-for-a-million .shot-red-arrow path { fill: #ff8e97; }
  #shot-for-a-million .shot-contact { fill: none; stroke: #ffb2b8; stroke-width: 4; }

  #shot-for-a-million .shot-stop {
    fill: rgb(255 207 114 / .16);
    stroke: var(--gold);
    stroke-width: 5;
    stroke-dasharray: 7 5;
  }

  #shot-for-a-million .shot-zoom, #shot-for-a-million .shot-close {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    position: absolute;
    top: 5px;
    right: 5px;
    z-index: 1;
    border-radius: 50%;
    border: 1px solid rgb(201 233 255 / .34);
    background: rgb(13 25 48 / .86);
    font-size: 23px;
    line-height: 1;
  }

  #shot-for-a-million h2 {
    margin-bottom: 12px;
    font-size: clamp(17px, 3.1vw, 23px);
    font-weight: 680;
    letter-spacing: -.015em;
    line-height: 1.2;
  }

  #shot-for-a-million .shot-answers {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  #shot-for-a-million .shot-answer {
    display: flex;
    gap: 11px;
    align-items: center;
    min-height: 72px;
    position: relative;
    text-align: left;
    border: 1px solid rgb(169 222 255 / .31);
    border-radius: 14px;
    padding: 11px 12px;
    background:
      radial-gradient(ellipse at 7% -14%, rgb(197 238 255 / .23), transparent 83%),
      linear-gradient(150deg, rgb(141 198 244 / .16), rgb(74 126 181 / .07));
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    box-shadow: inset 0 1px rgb(247 253 255 / .22), 0 5px 15px rgb(0 10 31 / .25);
    transition: transform .16s ease, border-color .16s ease, box-shadow .2s ease, background .18s ease;
    font-size: 15px;
    font-weight: 580;
    line-height: 1.28;
  }

  #shot-for-a-million .shot-letter {
    display: grid;
    place-items: center;
    flex: none;
    width: 29px;
    height: 29px;
    border: 1px solid rgb(183 230 255 / .35);
    border-radius: 50%;
    background: rgb(158 217 255 / .1);
    color: var(--ice);
    font-size: 13px;
    font-weight: 720;
  }

  @media (hover: hover) {
    #shot-for-a-million .shot-answer:not(:disabled, [aria-pressed="true"]):hover {
      border-color: var(--ice);
      transform: translateY(-2px);
    }
  }

  #shot-for-a-million .shot-answer:not(:disabled):active { transform: scale(.975); }

  #shot-for-a-million .shot-answer[aria-pressed="true"] {
    border-color: var(--gold);
    background:
      radial-gradient(ellipse at 20% 0, rgb(255 221 156 / .21), transparent 92%),
      linear-gradient(130deg, rgb(173 115 32 / .23), rgb(222 179 86 / .1));
    box-shadow: inset 0 1px rgb(255 230 165 / .3), 0 0 23px rgb(255 193 94 / .19);
  }

  #shot-for-a-million .shot-answer[aria-pressed="true"] .shot-letter {
    border-color: var(--gold);
    background: var(--gold);
    color: #251a13;
  }

  #shot-for-a-million .shot-answer:disabled:not([aria-pressed="true"]) {
    box-shadow: none;
    border-color: rgb(169 222 255 / .16);
    color: var(--silver);
  }

  #shot-for-a-million .shot-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 44px;
    margin-top: 13px;
  }

  #shot-for-a-million .shot-status { color: var(--silver); font-size: 13px; line-height: 1.22; }
  #shot-for-a-million [data-confirmed="true"] .shot-status { color: var(--gold); }

  #shot-for-a-million .shot-confirm {
    flex: none;
    min-height: 44px;
    padding: 7px 13px;
    border: 1px solid var(--gold);
    border-radius: 11px;
    background: var(--gold);
    color: #251a13;
    font-size: 14px;
    font-weight: 700;
  }

  #shot-for-a-million .shot-confirm:disabled {
    border-color: rgb(184 221 255 / .25);
    background: rgb(184 221 255 / .07);
    color: var(--silver);
  }

  #shot-for-a-million [data-confirmed="true"] .shot-confirm {
    background: rgb(184 221 255 / .07);
    border-color: rgb(184 221 255 / .35);
    color: var(--snow);
  }

  #shot-for-a-million .shot-diagram {
    width: min(430px, calc(100% - 22px));
    margin: auto;
    padding: 6px;
    border: 1px solid rgb(177 226 255 / .38);
    border-radius: 20px;
    background: var(--rink);
    color: var(--snow);
  }

  #shot-for-a-million .shot-close { top: 10px; right: 10px; }
  #shot-for-a-million .shot-diagram::backdrop { background: rgb(4 10 23 / .78); }

  @media (max-width: 484px) {
    #shot-for-a-million .shot-score { font-size: 12px; }
    #shot-for-a-million .shot-board { border-radius: 12px; }
    #shot-for-a-million .shot-zoom { width: 32px; height: 32px; font-size: 19px; }
    #shot-for-a-million .shot-answer {
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 6px;
      min-height: 91px;
      padding: 9px 10px;
      font-size: 14px;
    }
    #shot-for-a-million .shot-letter { width: 25px; height: 25px; font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #shot-for-a-million .shot-answer { transition: none; }
    #shot-for-a-million .shot-answer:not(:disabled) { transform: none; }
  }
</style>

<script>
  (() => {
    const root = document.getElementById("shot-for-a-million");
    const stage = root.querySelector(".shot-stage");
    const answers = [...root.querySelectorAll("[data-answer]")];
    const status = root.querySelector(".shot-status");
    const confirm = root.querySelector(".shot-confirm");
    const board = root.querySelector(".shot-board");
    const diagram = root.querySelector(".shot-diagram");
    const enlargedBoard = root.querySelector(".shot-diagram-image");
    const routeTemplate = root.querySelector(".shot-route-template");
    enlargedBoard.append(board.querySelector("img").cloneNode());

    const routes = {
      A: {
        yellow: "M210 803 C202 665 227 545 200 453 C191 422 182 390 181 368 C211 352 262 318 318 288",
        red: "M157 318 Q116 224 49 107",
        stop: [318, 288],
        description: "Хит по красной №2, ролл за гард"
      },
      B: {
        yellow: "M229 803 C216 675 202 548 178 466 C165 425 165 390 165 372",
        red: "M165 316 L163 20",
        stop: [165, 372],
        description: "Хит по красной №2 и стей"
      },
      C: {
        yellow: "M470 803 C482 666 430 551 382 465 C358 422 332 399 323 389",
        stop: [323, 389],
        description: "Обход гарда и фриз к красной №1"
      },
      D: {
        yellow: "M536 803 C558 663 528 477 471 353 C434 273 379 226 323 216",
        stop: [323, 216],
        description: "Дро за красную №1 в дальние 4 фута"
      }
    };

    const routeLayers = [board, enlargedBoard].map((surface, index) => {
      const layer = routeTemplate.content.firstElementChild.cloneNode(true);
      const yellow = layer.querySelector(".shot-track");
      const red = layer.querySelector(".shot-red-track");
      const yellowArrow = layer.querySelector(".shot-yellow-arrow");
      const redArrow = layer.querySelector(".shot-red-arrow");
      yellowArrow.id = "shot-yellow-arrow-" + index;
      redArrow.id = "shot-red-arrow-" + index;
      yellow.setAttribute("marker-end", "url(#" + yellowArrow.id + ")");
      red.setAttribute("marker-end", "url(#" + redArrow.id + ")");
      surface.append(layer);
      return {
        layer,
        yellow,
        red,
        outline: layer.querySelector(".shot-track-outline"),
        contact: layer.querySelector(".shot-contact"),
        stop: layer.querySelector(".shot-stop")
      };
    });

    let selected = "";
    let confirmed = false;

    function renderRoute(route) {
      for (const {layer, yellow, red, outline, contact, stop} of routeLayers) {
        layer.toggleAttribute("hidden", !route);
        if (!route) continue;
        yellow.setAttribute("d", route.yellow);
        outline.setAttribute("d", route.yellow);
        red.setAttribute("d", route.red ?? "");
        red.toggleAttribute("hidden", !route.red);
        contact.toggleAttribute("hidden", !route.red);
        stop.setAttribute("cx", route.stop[0]);
        stop.setAttribute("cy", route.stop[1]);
      }
      board.setAttribute("aria-label", route ? "Увеличить схему. " + route.description : "Увеличить схему");
    }

    function render() {
      const route = routes[selected];
      stage.dataset.confirmed = String(confirmed);
      for (const answer of answers) {
        answer.setAttribute("aria-pressed", String(answer.dataset.answer === selected));
        answer.disabled = confirmed;
      }
      const response = confirmed ? " · Ответ принят" : route ? " · " + route.description : "";
      status.textContent = selected ? selected + response : "Выбери бросок";
      confirm.disabled = !selected;
      confirm.textContent = confirmed ? "Ещё раз" : "Финальный ответ";
      renderRoute(route);
    }

    for (const answer of answers) {
      answer.addEventListener("click", () => {
        selected = answer.dataset.answer;
        render();
      });
    }

    confirm.addEventListener("click", () => {
      if (confirmed) {
        selected = "";
        confirmed = false;
      } else if (selected) {
        confirmed = true;
      }
      render();
      if (!confirmed) answers[0].focus();
    });

    board.addEventListener("click", () => diagram.showModal());
    root.querySelector(".shot-close").addEventListener("click", () => diagram.close());
    diagram.addEventListener("click", event => {
      if (event.target === diagram) {
        const bounds = diagram.getBoundingClientRect();
        if (event.clientX < bounds.left || event.clientX > bounds.right ||
            event.clientY < bounds.top || event.clientY > bounds.bottom) diagram.close();
      }
    });
  })();
</script>
</main>

      quizWebApp.setBackgroundColor("#0a1225");
